[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reason-analyze-backend"
version = "0.1.0"
description = "多轮经营归因分析系统 - 主后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "jsonschema>=4.21",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pymysql>=1.1",
    "tenacity>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
