[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reason-analyze-auth"
version = "0.1.0"
description = "多轮经营归因分析系统 - mock OAuth2 授权中心"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
