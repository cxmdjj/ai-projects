[project]
name = "contract-approval"
version = "0.1.0"
description = "企业合同审批自动审查系统:拉取审批单、下载附件、解析合同(含扫描件OCR)、规则审查、评论回写"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pypdf>=5.0",
    "pillow>=10.4",
    "reportlab>=4.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# 可选:真实 OCR 引擎(体积较大,演示默认用降级 OCR)
ocr = ["paddleocr>=2.8", "paddlepaddle>=2.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
